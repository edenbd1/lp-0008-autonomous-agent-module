# SPEL guest for the LP-0008 agent spending policy. Anchors the owner's limits
# by PDA address so the agent cannot raise its own ceiling, and consumes a
# single-use owner approval for anything above the threshold.
[workspace]

[package]
name        = "agent-verifier-guest"
version     = "0.1.0"
edition     = "2021"
license     = "MIT OR Apache-2.0"
publish     = false

[[bin]]
name = "agent_verifier"
path = "src/bin/agent_verifier.rs"

[dependencies]
# Vendored spel-framework repinned to LEZ v0.2.4 (47eba25): the published spel
# releases lag the testnet, so the SPEL types are aligned to lee_core here.
spel-framework = { path = "../../../../vendor/spel/spel-framework" }
# spel-framework's macro emits `nssa_core::` paths, so lee_core must be in scope
# under that name. Same aliasing spel itself uses.
nssa_core      = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "47eba256479f6f785acbd138834340703cd03401", features = ["host"], package = "lee_core" }
risc0-zkvm     = { version = "=3.0.5", default-features = false, features = ["std"] }

agent-policy-core = { path = "../../../agent-policy-core", default-features = false }

serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
sha2  = { version = "0.10", default-features = false }

# Pinned for the risc0 guest toolchain.
ruint = "=1.17.2"

[patch.crates-io]
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes.git", tag = "sha2-v0.10.8-risczero.0" }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
panic         = "abort"
