name: e2e vs local sequencer

# The whole LP-0008 policy lifecycle against a REAL LEZ sequencer in standalone
# mode, with RISC0_DEV_MODE=0: deploy the program, anchor an agent's envelope,
# spend inside it unattended, and be refused outside it.
#
# Separate from ci.yml on purpose. That one is a few minutes and gates every
# push; this builds the whole logos-execution-zone workspace, so it runs on a
# schedule and on demand. Both are CI; only one of them can be fast.
#
# It does not have a skip path. A job that completes through one reports green
# without having run, which is worse than red because nobody looks again. If
# this cannot run, it fails.

on:
  workflow_dispatch:
  schedule:
    - cron: '20 5 * * *'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  # The revision this was developed against. Floating HEAD would turn an
  # upstream change into a red build with no change of ours.
  LEZ_REV: 47eba25
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    name: policy lifecycle vs standalone sequencer
    runs-on: ubuntu-latest
    # REAL Risc0 proofs are generated in this job and none of them is optional,
    # which is where all of the time goes. Measured on the runners we have
    # actually been given, not estimated: the shielded transfer that funds the
    # agent took ~50 min (run 31883398914) and the agent's own spend ~55 min
    # (run 31867735056); the whole lifecycle step has come in at 2h08, 2h56 and
    # 2h59 on three separate green runs. At 120 the job was killed mid-proof
    # with the lifecycle unfinished, which is the same as not running it.
    #
    # 340 is not a safe number, it is the largest one available: a GitHub-hosted
    # job cannot exceed 360. No timeout covers what actually happens here, and
    # the instrumented run of 2026-08-17 finally showed what that is.
    #
    #   host      Linux x86_64, 2 cpu(s)
    #   cpu       AMD EPYC 7763 64-Core Processor
    #
    # TWO vCPUs, not the four the measurements above were taken on, with r0vm
    # pinned at ~190% of them. Proving is CPU-bound, so that run's proofs took
    # 1h42 and 1h11 against 25-35 minutes, and the script's own projection said
    # so at 1h42 into a 5h40 budget: `PACE: 1h42m07s a proof, 5 left -> about
    # 10h13m44s in total, past the 5h40m00s cap`. Which runner class a job lands
    # on is not something this file can choose.
    #
    # That same run also had its sequencer PANIC at 00:22Z (`JoinHandle polled
    # after completion`) and kept waiting on a proof for four more hours. The
    # heartbeat had been printing `| block  |` with nothing in it that whole
    # time. The script watches the sequencer's pid now and stops when it dies.
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      # Proving time is a function of cores, and the timeout above is justified
      # by a measurement on a specific machine, so record which machine.
      - name: What this is proving on, and whether it can finish
        run: |
          echo "cores: $(nproc)"
          free -g || true
          # REFUSE HERE, not sixteen minutes later. The script carries the same
          # guard, but it runs at the top of the lifecycle step -- after spel,
          # the sequencer and the wallet have been built. Measured: that
          # refusal cost 16m50s of wall time. This one costs about forty
          # seconds, and the two disagree about nothing: same threshold, same
          # reason, same red.
          #
          # Every run of this job on fewer than four cores has been killed at
          # the 340-minute cap with the lifecycle unfinished; every run on four
          # has finished green. 340 is the ceiling for a GitHub-hosted job, so
          # there is no budget to raise. A refusal is a RED and not a skip:
          # nothing was proved, and nothing is claimed.
          #
          # WHICH CLASS YOU GET IS NOT A LOTTERY, whatever the message below
          # used to say. It follows repository visibility: private repos get
          # 2 cores and 8 GB, public ones get 4 and 16. Re-dispatching a run
          # that "lost" is therefore futile while the repo is private, and
          # hours went into learning that the expensive way. If this refuses,
          # look at the repository's visibility before looking at anything else.
          cores=$(nproc)
          if [ "${E2E_ALLOW_SMALL_RUNNER:-0}" != "1" ] && [ "$cores" -lt 4 ]; then
            echo "this runner has $cores core(s) and cannot finish this job inside"
            echo "the 340-minute ceiling. Nothing was proved here."
            echo "Runner size follows repository VISIBILITY, not luck: private"
            echo "gets 2 cores, public gets 4. Re-dispatching draws the same"
            echo "machine. E2E_ALLOW_SMALL_RUNNER=1 spends the hours anyway."
            exit 1
          fi

      - name: Check out logos-execution-zone
        run: |
          git clone --filter=blob:none https://github.com/logos-blockchain/logos-execution-zone _external/lez
          git -C _external/lez checkout "$LEZ_REV"
          echo "LEZ at $(git -C _external/lez rev-parse --short HEAD)"

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache the LEZ build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            _external/lez/target
          key: lez-${{ runner.os }}-${{ env.LEZ_REV }}-${{ hashFiles('_external/lez/Cargo.lock') }}
          restore-keys: lez-${{ runner.os }}-${{ env.LEZ_REV }}-

      - name: Install r0vm
        run: |
          curl -L https://risczero.com/install | bash
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"
          "$HOME/.risc0/bin/rzup" install r0vm 3.0.5

      # v0.2.4 builds lez/keycard_wallet, which links against PC/SC. Taken from
      # LEZ's own ci.Dockerfile rather than assembled one package per failure.
      - name: System libraries LEZ needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libclang-dev libssl-dev pkg-config \
            libpcsclite-dev curl git jq python3-dev netcat-openbsd

      # `--locked`: cargo install ignores the committed lock without it, which
      # is how a green build goes red on an upstream release rather than on a
      # change of ours.
      - name: Build the vendored spel
        run: |
          cargo install --path vendor/spel/spel-cli --locked
          command -v spel

      - name: Build the standalone sequencer and the wallet
        working-directory: _external/lez
        run: |
          cargo build --release --features standalone -p sequencer_service
          cargo build --release -p wallet

      - name: Full lifecycle against it
        env:
          RISC0_DEV_MODE: 0
          LEZ_SRC: ${{ github.workspace }}/_external/lez
        run: |
          set -o pipefail
          ./scripts/e2e-local-sequencer.sh 2>&1 | tee e2e.out
          # Same argument as the SKIPPED guard in ci.yml. An exit code of 0 says
          # nothing died; it does not say the script reached the end. Assert on
          # the banner the last assertion prints, so a lifecycle that stopped
          # early cannot report itself green.
          grep -q VERIFIED e2e.out || {
            echo "the lifecycle never reached VERIFIED"; exit 1; }
          # And on each stage of it by name, so a future edit that drops one
          # fails here instead of quietly narrowing what this job claims.
          # The ceiling is READ from the script rather than repeated here. This
          # list asserted `of 100` while `PER_TX=100` lived in
          # scripts/e2e-local-sequencer.sh: changing the ceiling there would
          # have failed this job with "missing from the run", which names the
          # symptom and not the cause. A literal in one file that depends on a
          # variable in another is a literal that goes stale.
          per_tx=$(sed -n 's/^PER_TX=\([0-9][0-9]*\).*/\1/p' \
                   scripts/e2e-local-sequencer.sh | head -1)
          [ -n "$per_tx" ] || { echo "no PER_TX= in scripts/e2e-local-sequencer.sh"; exit 1; }

          for want in \
            'starting a real sequencer' \
            'funding it from the genesis vault' \
            'deploy the policy program' \
            'as the only account that may anchor it' \
            'a second, unlimited policy for the same agent was refused' \
            '50 (inside the envelope)' \
            '+50, read back from the chain' \
            "over the per-tx ceiling of $per_tx, and inside the balance) -> refused" \
            'Program error 6005:' \
            'recipient balance unchanged'; do
            grep -qF "$want" e2e.out || {
              echo "missing from the run: $want"; exit 1; }
          done
          echo "every stage of the lifecycle is present in the log"

      # `failure()` alone is NOT enough, and this was measured rather than
      # reasoned about: run 31950647965 ran past its 340-minute cap, GitHub
      # marked it `cancelled` rather than `failed`, this step was SKIPPED, and
      # the one diagnostic the job exists to leave behind was not written. A
      # timeout is the case where the sequencer log is most wanted and the only
      # case where `failure()` does not fire.
      - name: Sequencer log on failure or timeout
        if: failure() || cancelled()
        run: find /tmp -name 'sequencer.log' -newermt '-2 hours' -exec tail -100 {} \; 2>/dev/null || true
