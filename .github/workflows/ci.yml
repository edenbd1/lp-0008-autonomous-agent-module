name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to avoid an email flood.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Policy primitive and its adversarial tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # First, and before anything is built, because a dangling citation costs
      # nothing to check and this repository has shipped several. check-docs.py
      # was added and then run by nothing, which is the failure it exists to
      # catch, one level up. It needs no toolchain, so it fails in seconds
      # rather than after the risc0 build in the next job.
      - name: Documentation points at things that exist
        run: |
          set -e
          ./scripts/check-docs.py | tee check-docs.out
          # The summary line is the assertion that it walked the tree at all: a
          # checker that found nothing to check exits 0 too. No step may go
          # green by skipping.
          grep -q "every path, line citation and symbol citation resolves" check-docs.out \
            || { echo "check-docs.py exited 0 without reporting a full pass"; exit 1; }
          if grep -q SKIPPED check-docs.out; then
            echo "check-docs.py reported SKIPPED"; exit 1
          fi
          rm -f check-docs.out

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # `--locked` throughout. Without it cargo re-resolves to the newest
      # compatible dependencies and ignores the committed lock, which is how a
      # build that was green yesterday goes red today on an upstream release
      # rather than on a change of ours.
      - name: Build
        run: cargo build --workspace --release --locked

      - name: Test
        run: cargo test --workspace --release --locked

  binaries:
    name: The committed program matches its recorded ImageID
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # demo.sh runs the policy tests and then executes the committed guest ELF
      # in the risc0 executor, which is a large dependency tree built once and
      # cached. Both target directories are cached: the workspace one for the
      # policy crate, and the adversarial checker's own, which is a separate
      # workspace precisely so `cargo build --workspace` does not pay for risc0.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            crates/agent-verifier-adversarial/target
          key: demo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: demo-${{ runner.os }}-

      # The guest is content-addressed and committed under artifacts/programs/.
      # Rebuilding it needs the risc0 docker toolchain and is done locally;
      # docs/DEPLOYMENT.md records the reproduction.
      #
      # Two steps used to live here, and between them they hardcoded the deploy
      # hash TWICE — once as `want=` and once in a curl payload. That is the
      # same literal-that-must-be-hand-edited-on-every-redeploy pattern that put
      # three superseded transactions in SUBMISSION-DRAFT.md, and it was wrong
      # three times today under different names: a content-addressed chain moves
      # that hash on every deploy, so a copy of it in a workflow is a copy that
      # has to be remembered.
      #
      # verify-deployment.sh derives it instead — SHA256(u32_le(len)||bytecode)
      # of the committed bytes — and then asks the sequencer, which is strictly
      # stronger than the literal was: the literal proved only that the binary
      # had not changed, this proves the binary is the program on chain. It also
      # runs the cannot-exist control, checks each policy account's limits
      # against the chain, and attributes every settlement to the program that
      # owns the ledger it charged, so a row orphaned by a redeploy is labelled
      # rather than counted.
      - name: The committed program is the program on chain
        run: |
          set -e
          ./scripts/verify-deployment.sh 2>&1 | tee verify.out
          # The exit code is the assertion; the banner proves it got that far.
          # No step may go green by skipping.
          grep -q "agrees with artifacts/ and with the chain" verify.out \
            || { echo "verify-deployment.sh exited 0 without reporting a full pass"; exit 1; }
          if grep -q SKIPPED verify.out; then
            echo "verify-deployment.sh reported SKIPPED"; exit 1
          fi
          # It must have derived a hash and reached the chain, not short-circuited.
          grep -q "committed binary hashes to" verify.out \
            || { echo "no deploy hash was derived"; exit 1; }
          grep -q "control hash returns null" verify.out \
            || { echo "the cannot-exist control did not run"; exit 1; }
          rm -f verify.out

      # SUBMISSION-DRAFT.md's evidence sections are generated from the chain and
      # from the committed binary by scripts/submission-evidence.py. --check
      # re-fetches every figure and fails if the document has drifted from what
      # the chain now says. This step is the whole anti-rot property: without
      # it, the generator is something a person has to remember to run, and the
      # last four times a person had to remember, the document shipped claiming
      # transactions that DEPLOYMENT.md disowns by name.
      - name: SUBMISSION-DRAFT.md still matches the chain
        run: |
          set -e
          if ! ./scripts/submission-evidence.py --check SUBMISSION-DRAFT.md > evidence.out 2>&1; then
            cat evidence.out
            echo "SUBMISSION-DRAFT.md is stale. Run: ./scripts/submission-evidence.py --write SUBMISSION-DRAFT.md"
            exit 1
          fi
          cat evidence.out

          # A green exit code is not evidence that anything was checked. Assert
          # the banner, and refuse the skip pattern this workflow already guards
          # against elsewhere: no step may go green by skipping.
          if ! grep -q "agrees with" evidence.out; then
            echo "the check exited 0 without reporting agreement: it did not run to completion"
            exit 1
          fi
          if grep -q SKIPPED evidence.out; then
            echo "the evidence check reported SKIPPED"
            exit 1
          fi

          # The control, and the same argument as the dedede hash two steps up:
          # a checker that cannot fail would pass everything above just as
          # happily. So alter one generated figure and require a red.
          cp SUBMISSION-DRAFT.md drift.md
          python3 - <<'PY'
          import re, sys
          s = open('drift.md', encoding='utf-8').read()
          new, n = re.subn(r'\| block \| (\d+) \|',
                           lambda m: '| block | %d |' % (int(m.group(1)) + 1), s, count=1)
          if n != 1:
              sys.exit("the control found no block figure to alter; the "
                       "generated sections are not shaped as expected")
          open('drift.md', 'w', encoding='utf-8').write(new)
          PY
          if ./scripts/submission-evidence.py --check drift.md > drift.out 2>&1; then
            echo "a document with an altered block number PASSED the check:"
            cat drift.out
            exit 1
          fi
          rm -f drift.md drift.out evidence.out
          echo "OK the document matches the chain, and a drifted one is rejected"

      - name: demo.sh runs from a clean clone
        run: ./scripts/demo.sh

  skills:
    name: The skills behave, against fake ports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JSON header
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nlohmann-json3-dev

      # skills_test.cpp guards its module half behind
      #     #if __has_include(<logos_module_context.h>)
      # and, when the header is absent, prints a SKIPPED banner and exits 0. So
      # for as long as the SDK was not on the include path this job compiled 18
      # of that suite's 90 assertions and went green on them. The 72 it dropped
      # are skill registration, the plugin's JSON escaping, its exception
      # isolation, its mutex discipline and its lifecycle — precisely the
      # defects that survived undetected here before, since a module that
      # answers skills() with [] loads perfectly and looks like it works.
      #
      # Pinned to a revision, not to master: master has already moved past this
      # commit, and a floating head turns an upstream push into a red build on a
      # change that is not ours. Same argument as `--locked` on the cargo lines.
      #
      # Headers only, and only two of them are reached — logos_module_context.h
      # and logos_result.h. Both are Qt-free, so this does not resurrect the Qt
      # module build removed in 829ef18 for failing on the SDK's own ScopedQArg
      # under the runner's GCC.
      - name: Check out the Logos C++ SDK
        env:
          CPP_SDK_REV: c87f3437e38616436df6e475570f9d25abf9b36f
        run: |
          set -e
          git clone --filter=blob:none \
            https://github.com/logos-co/logos-cpp-sdk _external/logos-cpp-sdk
          git -C _external/logos-cpp-sdk checkout --quiet "$CPP_SDK_REV"
          echo "logos-cpp-sdk at $(git -C _external/logos-cpp-sdk rev-parse --short HEAD)"
          # A clone that half-worked would leave the compile below on the
          # guarded path, passing while testing nothing. Fail here instead.
          test -f _external/logos-cpp-sdk/cpp/logos_module_context.h
          test -f _external/logos-cpp-sdk/cpp/logos_result.h

      # No Logos node here on purpose. A node is needed to prove a message
      # arrives; it is not needed to prove a skill refuses when the node is
      # down, blames the right half of a share, or does not throw on a
      # malformed payload — which is what a stub would get wrong.
      #
      # Every skill's translation unit is on this line, not just the two ports
      # under test: registration is what links the skills into the module, so
      # the module half of the suite needs all of them to link at all.
      #
      # -Wall -Wextra, but deliberately not -Werror, here and below: the
      # compiler is whatever ubuntu-latest ships, and -Werror would turn a clang
      # upgrade into a red build on a change that is not ours — the same failure
      # `--locked` spends effort to avoid on the Rust side. Warnings stay
      # visible in the log; the assertions are what gate the merge.
      - name: Exercise the skills, and the module that hosts them
        run: |
          set -euo pipefail
          clang++ -std=c++17 -Wall -Wextra \
            -I_external/logos-cpp-sdk/cpp \
            module/tests/skills_test.cpp \
            module/src/agent_module_plugin.cpp \
            module/src/messaging_skills.cpp \
            module/src/storage_skills.cpp \
            module/src/inference.cpp \
            module/src/wallet_skills.cpp \
            module/src/program_skills.cpp \
            module/src/agent_skills.cpp \
            module/src/owner_channel.cpp \
            module/src/task_persistence.cpp \
            -o skills_test
          ./skills_test | tee skills_test.out
          # The suite's exit code cannot distinguish "the module half passed"
          # from "the module half was compiled out", so assert on the banner
          # too. No step may go green by skipping.
          if grep -q SKIPPED skills_test.out; then
            echo "the module half did not compile in: the SDK headers were not reached"
            exit 1
          fi

      # The two Reliability criteria that are about the *module* rather than
      # about a class beside it. `task_persistence_test` and
      # `owner_channel_test` below both passed for months against code the
      # shipped plugin never constructed — 121 and 85 green assertions
      # describing behaviour no artefact had. This suite drives
      # `AgentModuleImpl` itself: configure, start, open tasks, destroy it,
      # build it again over the same directory, and check what came back. Same
      # for the owner channel a loaded plugin actually has, which is a module
      # event out and `approveSpend` back.
      - name: A restart, and an owner who does not answer
        run: |
          set -euo pipefail
          clang++ -std=c++17 -Wall -Wextra \
            -I_external/logos-cpp-sdk/cpp \
            module/tests/module_recovery_test.cpp \
            module/src/agent_module_plugin.cpp \
            module/src/messaging_skills.cpp \
            module/src/storage_skills.cpp \
            module/src/inference.cpp \
            module/src/wallet_skills.cpp \
            module/src/program_skills.cpp \
            module/src/agent_skills.cpp \
            module/src/task_persistence.cpp \
            -o module_recovery_test
          ./module_recovery_test

      # Negative control, in the shape the storage-node job below uses: put the
      # module back in the state it was in before that suite existed — the
      # snapshot never constructed — and assert the suite goes red. Without
      # this, "a restart keeps pending task state" is a claim nobody has
      # watched fail, and this repository has twice shipped an assertion that
      # could not.
      - name: Negative control — the recovery suite is falsifiable
        run: |
          set -euo pipefail
          sed 's|    if (dir.empty()) {|    if (true) {|' \
            module/src/agent_module_plugin.cpp > broken_plugin.cpp
          ! diff -q module/src/agent_module_plugin.cpp broken_plugin.cpp > /dev/null
          clang++ -std=c++17 -w \
            -I_external/logos-cpp-sdk/cpp -Imodule/src \
            module/tests/module_recovery_test.cpp \
            broken_plugin.cpp \
            module/src/messaging_skills.cpp \
            module/src/storage_skills.cpp \
            module/src/inference.cpp \
            module/src/wallet_skills.cpp \
            module/src/program_skills.cpp \
            module/src/agent_skills.cpp \
            module/src/task_persistence.cpp \
            -o broken_recovery_test
          set +e
          ./broken_recovery_test > broken_recovery.out 2>&1; rc=$?
          set -e
          echo "exit=$rc  failures=$(grep -c '^  FAIL' broken_recovery.out || true)"
          [ "$rc" -ne 0 ] || { echo "a module that persists nothing passed the recovery suite"; exit 1; }

      # Same argument for inference. No model here and none needed: what has to
      # hold is that a backend which is down, slow, incoherent or actively
      # hostile cannot move money, and a fake answers that better than a real
      # model would — a real one cannot be made to reliably return a malicious
      # amount on demand.
      - name: Exercise the inference port
        run: |
          clang++ -std=c++17 -Wall -Wextra module/tests/inference_test.cpp \
            module/src/inference.cpp \
            -o inference_test
          ./inference_test

      # The remaining suites existed and were never run here, which by this
      # repository's own standard means they were not run at all. Each is its own
      # step so a red X names the suite that broke rather than "the skills job".
      - name: Exercise the wallet skills
        run: |
          clang++ -std=c++17 -Wall -Wextra module/tests/wallet_skills_test.cpp \
            module/src/wallet_skills.cpp \
            -o wallet_skills_test
          ./wallet_skills_test

      - name: Exercise the program skills
        run: |
          clang++ -std=c++17 -Wall -Wextra module/tests/program_skills_test.cpp \
            module/src/program_skills.cpp \
            -o program_skills_test
          ./program_skills_test

      - name: Exercise the agent-coordination skills
        run: |
          clang++ -std=c++17 -Wall -Wextra module/tests/agent_skills_test.cpp \
            module/src/agent_skills.cpp \
            -o agent_skills_test
          ./agent_skills_test

      # No Logos node again, and again on purpose. What decides whether money
      # moves is not that a message crosses the network: it is that a channel
      # which will not open is reported rather than pretended, that an answer to
      # another request cannot settle this one, that an approval naming different
      # terms is refused, and that an owner who never replies is terminal instead
      # of a quiet fallback to acting alone. A fake owner can be made silent,
      # late, or hostile on demand; a real one cannot.
      - name: Exercise the owner channel
        run: |
          clang++ -std=c++17 -Wall -Wextra module/tests/owner_channel_test.cpp \
            module/src/owner_channel.cpp \
            -o owner_channel_test
          ./owner_channel_test

      # The dangerous window is not the crash, it is between the wallet
      # returning a hash and the task recording it: the money moved, and a
      # snapshot taken there reloads as unpaid. These cases cover the payment
      # intent written before the wallet is called, and every way a snapshot can
      # be unreadable — truncated, malformed, from a future schema — because the
      # one outcome that must never happen is a corrupt file loading as an empty
      # task list and a paid task being paid a second time.
      - name: Exercise task-state persistence
        run: |
          clang++ -std=c++17 -Wall -Wextra module/tests/task_persistence_test.cpp \
            module/src/task_persistence.cpp \
            -o task_persistence_test
          ./task_persistence_test

      # ---------------------------------------------------------------------
      # Everything under module/tests/ is accounted for. Seven suites run above.
      # The four that do not run here are named, with what they need, because a
      # suite silently absent from CI is indistinguishable from one that was
      # never written — and this repository's own standard is that a step CI
      # skips counts as not run. None of these is skipped: they are not claimed.
      #
      #   module/tests/plugin_load_test.cpp
      #     Needs Qt 6 (QtCore, QtRemoteObjects, QtNetwork) AND the built
      #     plugin binary to load — it drives QPluginLoader over
      #     build-basecamp/modules/agent_plugin.{so,dylib}. Building that
      #     plugin needs the logos-module-builder / logos-module toolchain,
      #     which is the job removed in 829ef18: it fails on the SDK's own
      #     ScopedQArg, an overload GCC rejects and Clang accepts, and
      #     switching CI to Clang did not clear it. Upstream's code, not ours.
      #     Run by hand against the built module; docs/basecamp.md carries the
      #     exact compile line and the recorded output.
      #
      #   module/tests/logos_core_load_test.cpp
      #     Needs Logos Basecamp *installed*: it dlopen's the shipped
      #     liblogos_core, links the app's own bundled QtCore, and needs
      #     LOGOS_HOST_PATH to point at the app's logos_host binary. There is
      #     no Basecamp on a GitHub runner and no headless install of one, so
      #     this is the packaged-artifact check and it stays manual.
      #     docs/basecamp.md carries the invocation and the recorded output.
      #
      #   module/tests/storage_node_drive.c
      #     Runs here now — see the `storage-node` job below. The earlier note
      #     in this block said it needed a from-source Nim build. That was
      #     wrong: logos-storage-nim's own release workflow builds
      #     libstorage.so on ubuntu-24.04 and publishes it as a release asset,
      #     so the runner downloads what upstream built instead of building it.
      #
      #   module/tests/delivery_node_drive.c
      #     Still not here, and the reason is specific rather than "it is
      #     slow". There is no prebuilt liblogosdelivery for Linux anywhere
      #     public to download:
      #       - logos-messaging/logos-delivery publishes no library asset on
      #         any release from v0.21.1 to v0.38.1. The one shared library it
      #         ever shipped is libwaku-v0.36.0-linux-x86_64.so, from before
      #         the rename, and it exports waku_* — none of the
      #         logosdelivery_* symbols this driver links against.
      #       - Its release-assets.yml would build a .deb on ubuntu-22.04, but
      #         every run of that workflow since v0.38.0 ended in
      #         failure/cancelled with zero artifacts produced.
      #       - Its ci.yml does build build/liblogosdelivery.so on ubuntu-22.04
      #         and upload it, but with retention-days: 1, into another
      #         repository's artifact store, which this repo's GITHUB_TOKEN
      #         cannot read.
      #     So the only route is building it on the runner. That is Nim 2.2.4 +
      #     nimble 0.22.3 + recursive submodules; librln is *not* the cargo
      #     build claimed here before, since scripts/build_rln.sh downloads
      #     zerokit v2.0.2's x86_64-unknown-linux-gnu-stateless-rln.tar.gz and
      #     only falls back to cargo when no asset matches the host triple. The
      #     cost is the Nim compile: upstream's own ubuntu-22.04 build step
      #     took 26m27s *with* a warm nimble-deps cache. That is affordable
      #     with caching and it is a real option, not an impossibility — it is
      #     simply not claimed here until it has been run and seen green.
      #     Driven meanwhile by scripts/exercise-nodes.sh, which owns the paths.
      # ---------------------------------------------------------------------

  # A real Storage node, on the runner, doing the thing the skill claims.
  #
  # The fake-port suites above prove the skills behave when the node misbehaves.
  # They cannot prove a file was stored, because nothing stores it. This job
  # starts an actual Logos Storage node, hands it a file, and asserts on what
  # comes back — and then deliberately breaks the same driver twice and asserts
  # it goes red, because an assertion never observed failing is not evidence.
  storage-node:
    name: A real Storage node takes a file and returns its address
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Pinned to the exact tag scripts/exercise-nodes.sh builds locally, and
      # checksummed: a release asset is mutable, and "we downloaded something"
      # is not the same claim as "we downloaded this". The zip carries
      # libstorage.so and the libstorage.h the driver compiles against, so the
      # header and the binary cannot drift apart.
      - name: The Storage library, as upstream built and published it
        env:
          STORAGE_VERSION: v0.4.4
          STORAGE_SHA256: d2f8e0207e4688c58a89adfb2bbb9b2ae0688879815427372e467bdbc4f05102
        run: |
          set -euo pipefail
          curl -fsSL -o libstorage.zip \
            "https://github.com/logos-storage/logos-storage-nim/releases/download/${STORAGE_VERSION}/libstorage-linux-amd64-${STORAGE_VERSION}.zip"
          echo "${STORAGE_SHA256}  libstorage.zip" | sha256sum -c -
          mkdir -p _external/logos-storage-nim/build _external/logos-storage-nim/library
          unzip -o -q libstorage.zip -d unpacked
          mv unpacked/libstorage.so _external/logos-storage-nim/build/
          mv unpacked/libstorage.h  _external/logos-storage-nim/library/
          ls -l _external/logos-storage-nim/build/libstorage.so

      - name: Build the driver against it
        run: |
          set -euo pipefail
          cc -Wall -Wextra -o storage_node_drive module/tests/storage_node_drive.c \
            -I_external/logos-storage-nim/library \
            -L_external/logos-storage-nim/build -lstorage

      # The driver writes a repo and an upload into the working directory, so
      # give it one of its own. Every step in it is an assertion and the exit
      # code is the result, so a node that silently failed to start cannot
      # produce a passing transcript.
      - name: Drive the node
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/_external/logos-storage-nim/build"
          mkdir -p run-ok
          ( cd run-ok && "$GITHUB_WORKSPACE/storage_node_drive" )

      # Negative control 1, with the shipped source unmodified: block the path
      # the node needs for its repo with a regular file. The node cannot start,
      # and the driver must go red. If this step passes, every assertion above
      # it is decoration.
      - name: Negative control — the driver goes red when the node cannot start
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/_external/logos-storage-nim/build"
          mkdir -p run-blocked && printf 'not a directory' > run-blocked/lp0008-storage
          set +e
          ( cd run-blocked && "$GITHUB_WORKSPACE/storage_node_drive" ); rc=$?
          set -e
          echo "exit=$rc"
          [ "$rc" -ne 0 ] || { echo "the driver passed against a node that never started"; exit 1; }

      # Negative control 2: one character of the assertion changed, so it looks
      # for a filename that was never uploaded. The node still starts, still
      # stores the file, still returns a manifest — only the claim is false.
      # This is what proves the manifest check is load-bearing rather than a
      # non-empty-string test that any reply would satisfy.
      - name: Negative control — the manifest assertion is falsifiable
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/_external/logos-storage-nim/build"
          sed 's/lp0008-upload\.txt"),/lp0008-NEVER-uploaded.txt"),/' \
            module/tests/storage_node_drive.c > broken_drive.c
          ! diff -q module/tests/storage_node_drive.c broken_drive.c > /dev/null
          cc -Wall -Wextra -o broken_drive broken_drive.c \
            -I_external/logos-storage-nim/library \
            -L_external/logos-storage-nim/build -lstorage
          mkdir -p run-broken
          set +e
          ( cd run-broken && "$GITHUB_WORKSPACE/broken_drive" ); rc=$?
          set -e
          echo "exit=$rc"
          [ "$rc" -ne 0 ] || { echo "the manifest assertion cannot fail"; exit 1; }
