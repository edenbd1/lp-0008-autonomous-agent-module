name: probe pipefail
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -euo pipefail
          echo "pipe buffer: $(python3 -c 'import os;print(os.fpathconf(0,"PC_PIPE_BUF"))' 2>/dev/null || echo '?')"
          for kb in 8 16 24 32 40 48 56 64; do
            f=$(mktemp)
            { echo "## Summary"; head -c $((kb*1024)) /dev/zero | tr '\0' 'x' | fold -w 100; } > "$f"
            C=$(cat "$f")
            if ! echo "$C" | grep -qF "## Summary"; then r=MISSING; else r=found; fi
            printf '%3dKB (%6d octets) -> %s\n' "$kb" "$(wc -c < "$f")" "$r"
            rm -f "$f"
          done
