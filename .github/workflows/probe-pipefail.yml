name: probe pipefail
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -euo pipefail
          for kb in 8 12 16 20 24 28 32 36; do
            f=$(mktemp)
            { echo "## Summary"; head -c $((kb*1024)) /dev/zero | tr '\0' 'x' | fold -w 100; } > "$f"
            C=$(cat "$f")
            fails=0
            for i in $(seq 1 100); do
              echo "$C" | grep -qF "## Summary" || fails=$((fails+1))
            done
            printf 'size %6d octets -> %3d échec(s) sur 100\n' "$(wc -c < "$f")" "$fails"
            rm -f "$f"
          done
