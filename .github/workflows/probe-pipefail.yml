name: probe pipefail
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          echo "bytes: $(wc -c < solutions/LP-0008.md)"
          C=$(cat solutions/LP-0008.md)
          SECTIONS=("## Summary" "## Repository" "## Approach" "## Success Criteria Checklist"
                    "## FURPS Self-Assessment" "### Functionality" "### Usability" "### Reliability"
                    "### Performance" "### Supportability" "## Terms & Conditions")
          fails=0; checks=0
          for i in $(seq 1 30); do
            for s in "${SECTIONS[@]}"; do
              checks=$((checks+1))
              echo "$C" | grep -qF "$s" || { fails=$((fails+1)); echo "MISS: $s"; }
            done
          done
          echo "RESULT: $fails failure(s) across $checks checks"
