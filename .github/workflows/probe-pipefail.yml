name: probe pipefail
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          echo "bytes: $(wc -c < solutions/LP-0008.md)"
          C=$(cat solutions/LP-0008.md)
          miss=0
          for s in "## Summary" "## Repository" "## Approach" "## Success Criteria Checklist" \
                   "## FURPS Self-Assessment" "### Functionality" "### Usability" "### Reliability" \
                   "### Performance" "### Supportability" "## Terms & Conditions"; do
            if ! echo "$C" | grep -qF "$s"; then echo "REPORTED MISSING: $s"; miss=$((miss+1)); fi
          done
          echo "RESULT: $miss section(s) reported missing"
          # ...and ten consecutive runs, because this is a race and one pass is luck
          fails=0
          for i in $(seq 1 10); do
            for s in "## Summary" "## Approach" "### Functionality"; do
              echo "$C" | grep -qF "$s" || fails=$((fails+1))
            done
          done
          echo "FLAKE: $fails failure(s) across 30 checks"
